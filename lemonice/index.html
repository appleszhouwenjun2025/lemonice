<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍋 柠檬冰 | 实时新闻</title>
<meta name="description" content="柠檬冰 — 实时新闻聚合与时钟">
<style>
/* ==================== 基础重置与变量 ==================== */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --lemon:#FACC15; --lemon-2:#FDE047; --lemon-light:#FEF9C3;
  --ice:#38BDF8;   --ice-2:#7DD3FC;   --ice-light:#E0F2FE;
  --text:#1E293B; --gray:#64748B; --bg:#F8FAFC;
  --card:#FFFFFF; --border:rgba(0,0,0,.06);
  --shadow:0 2px 8px rgba(0,0,0,.06); --shadow-lg:0 12px 28px rgba(0,0,0,.10);
  --radius:16px;
}
[data-theme="dark"]{
  --text:#E2E8F0; --gray:#94A3B8; --bg:#0B1120; --card:#162032;
  --border:rgba(255,255,255,.08); --lemon-light:#3a2e06; --ice-light:#0c2740;
  --shadow:0 2px 8px rgba(0,0,0,.3); --shadow-lg:0 12px 28px rgba(0,0,0,.4);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,var(--lemon-light) 0%,var(--bg) 35%,var(--ice-light) 100%);
  background-attachment:fixed; color:var(--text); min-height:100vh;
  transition:background .4s,color .3s;
}

/* ==================== 顶部导航栏 ==================== */
header{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 28px; background:rgba(255,255,255,.65);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border); position:sticky;top:0;z-index:200;
}
[data-theme="dark"] header{background:rgba(22,32,50,.75)}
.logo{
  font-size:22px;font-weight:800;letter-spacing:1px;white-space:nowrap;
  background:linear-gradient(135deg,var(--lemon),var(--ice));
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.header-right{display:flex;align-items:center;gap:12px}
.theme-btn{
  width:38px;height:38px;border:none;border-radius:50%;
  background:rgba(0,0,0,.05);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .2s;
}
.theme-btn:hover{background:rgba(0,0,0,.1);transform:scale(1.08)}
[data-theme="dark"] .theme-btn{background:rgba(255,255,255,.08)}
[data-theme="dark"] .theme-btn:hover{background:rgba(255,255,255,.15)}
.bili-link{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 18px;border-radius:22px;text-decoration:none;
  background:linear-gradient(135deg,#FB7299,#ff5577);
  color:#fff;font-size:14px;font-weight:600;white-space:nowrap;
  transition:transform .2s,box-shadow .2s;
}
.bili-link:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(251,114,153,.45)}

/* ==================== 主区域 ==================== */
main{max-width:1200px;margin:0 auto;padding:24px 20px 60px}

/* ---- 时钟与跳转 ---- */
.hero{text-align:center;padding:48px 16px 32px}
.clock-box{
  display:inline-block;padding:28px 56px;border-radius:24px;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:var(--shadow-lg); border:1px solid rgba(255,255,255,.4);
}
[data-theme="dark"] .clock-box{
  background:rgba(22,32,50,.55); border-color:rgba(255,255,255,.06);
}
.clock-date{font-size:15px;color:var(--gray);margin-bottom:6px;letter-spacing:1px}
.clock-time{
  font-size:54px;font-weight:200;font-variant-numeric:tabular-nums;
  letter-spacing:3px;line-height:1;
  background:linear-gradient(135deg,var(--lemon),var(--ice));
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.redirect-btn{
  display:inline-flex;align-items:center;gap:8px;margin-top:28px;
  padding:14px 40px;border-radius:32px;text-decoration:none;
  background:linear-gradient(135deg,var(--lemon),#F59E0B);
  color:#1E293B;font-size:17px;font-weight:700;border:none;cursor:pointer;
  transition:transform .25s,box-shadow .25s;
  box-shadow:0 6px 18px rgba(250,204,21,.4);
}
.redirect-btn:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(250,204,21,.5)}

/* ---- 新闻区 ---- */
.news-section{margin-top:8px}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.sec-title{font-size:22px;font-weight:700}
.sec-title .count{font-size:14px;font-weight:400;color:var(--gray);margin-left:8px}
.refresh-btn{
  padding:8px 18px;border-radius:10px;cursor:pointer;
  background:var(--card);border:1px solid var(--border);
  color:var(--text);font-size:14px;
  transition:border-color .2s,transform .15s;
}
.refresh-btn:hover{border-color:var(--ice);transform:translateY(-1px)}
.refresh-btn:active{transform:translateY(0)}
.refresh-btn:disabled{opacity:.6;cursor:default}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tab{
  padding:6px 18px;border-radius:20px;border:none;cursor:pointer;
  font-size:13px;background:var(--card);color:var(--gray);
  border:1px solid var(--border);transition:all .2s;
}
.tab:hover{border-color:var(--ice-2)}
.tab.active{
  background:linear-gradient(135deg,var(--lemon),var(--ice));
  color:#fff;font-weight:600;border-color:transparent;
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
.card{
  background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
  border:1px solid var(--border);
  transition:transform .25s,box-shadow .25s;
  display:flex;flex-direction:column;
}
.card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg)}
.card-img{width:100%;height:180px;object-fit:cover;background:var(--ice-light)}
.card-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card-src{
  display:inline-flex;align-items:center;gap:4px;
  font-size:12px;font-weight:600;padding:2px 10px;border-radius:10px;
  align-self:flex-start;
}
.src-cctv{background:#FEE2E2;color:#DC2626}
.src-bbc{background:#DBEAFE;color:#2563EB}
.src-rfi{background:#FCE7F3;color:#DB2777}
.src-default{background:var(--ice-light);color:var(--ice)}
.card-title{
  font-size:16px;font-weight:600;line-height:1.5;color:var(--text);
  text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;transition:color .2s;
}
.card-title:hover{color:var(--ice)}
.card-desc{
  font-size:13px;color:var(--gray);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.card-time{font-size:12px;color:var(--gray);margin-top:auto;display:flex;align-items:center;gap:4px}

/* ---- 状态提示 ---- */
.status{text-align:center;padding:60px 20px;color:var(--gray)}
.spinner{
  width:42px;height:42px;margin:0 auto 16px;
  border:3px solid var(--ice-light);border-top-color:var(--ice);
  border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:#EF4444;font-size:14px}

/* ---- 页脚 ---- */
footer{text-align:center;padding:32px 16px;color:var(--gray);font-size:13px}
footer a{color:var(--ice);text-decoration:none}

/* ==================== 响应式 ==================== */
@media(max-width:640px){
  header{padding:10px 14px}
  .logo{font-size:18px}
  .bili-link{padding:6px 14px;font-size:13px}
  .clock-time{font-size:38px;letter-spacing:2px}
  .clock-box{padding:20px 32px}
  .hero{padding:32px 12px 20px}
  .redirect-btn{padding:12px 32px;font-size:15px}
  .grid{grid-template-columns:1fr}
  main{padding:16px 12px 40px}
  .sec-title{font-size:18px}
}
</style>
</head>
<body>

<!-- ========== 顶部导航栏 ========== -->
<header>
  <div class="logo">🍋 柠檬冰</div>
  <div class="header-right">
    <button class="theme-btn" id="themeBtn" title="切换明暗主题">🌙</button>
    <a href="https://space.bilibili.com/3494373861886160?spm_id_from=333.1007.0.0"
       target="_blank" rel="noopener" class="bili-link">▶ 哔哩哔哩</a>
  </div>
</header>

<!-- ========== 主区域 ========== -->
<main>
  <!-- 时钟与跳转 -->
  <section class="hero">
    <div class="clock-box">
      <div class="clock-date" id="clockDate">—</div>
      <div class="clock-time" id="clockTime">00:00:00</div>
    </div>
    <br>
    <a href="https://zhouwenjun.cc.cd" target="_blank" rel="noopener" class="redirect-btn">
      🚀 原网站跳转
    </a>
  </section>

  <!-- 新闻区 -->
  <section class="news-section">
    <div class="sec-head">
      <h2 class="sec-title">📰 实时新闻 <span class="count" id="newsCount"></span></h2>
      <button class="refresh-btn" id="refreshBtn">🔄 刷新</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div id="newsGrid">
      <div class="status"><div class="spinner"></div>正在加载新闻…</div>
    </div>
  </section>
</main>

<!-- ========== 页脚 ========== -->
<footer>
  <p>🍋 柠檬冰 © 2025 · 新闻来源：CCTV / BBC中文 / RFI中文 · Powered by
    <a href="https://cloudflare.com" target="_blank" rel="noopener">Cloudflare</a></p>
</footer>

<script>
// ============================================================
//  柠檬冰 · 前端脚本
//  功能：实时时钟、明暗主题、新闻加载与渲染、来源筛选、自动刷新
// ============================================================

// ==================== 实时时钟 ====================
var weekdays = ['日','一','二','三','四','五','六'];
function pad(n){ return String(n).padStart(2,'0'); }
function tick(){
  var d = new Date();
  document.getElementById('clockDate').textContent =
    d.getFullYear() + '年' + pad(d.getMonth()+1) + '月' + pad(d.getDate()) + '日 星期' + weekdays[d.getDay()];
  document.getElementById('clockTime').textContent =
    pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}
tick();
setInterval(tick, 1000);

// ==================== 明暗主题切换 ====================
var themeBtn = document.getElementById('themeBtn');
if(localStorage.getItem('theme') === 'dark'){
  document.documentElement.setAttribute('data-theme','dark');
  themeBtn.textContent = '☀️';
}
themeBtn.addEventListener('click', function(){
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if(isDark){
    document.documentElement.removeAttribute('data-theme');
    themeBtn.textContent = '🌙';
    localStorage.setItem('theme','light');
  } else {
    document.documentElement.setAttribute('data-theme','dark');
    themeBtn.textContent = '☀️';
    localStorage.setItem('theme','dark');
  }
});

// ==================== 新闻加载与渲染 ====================
var allNews = [];          // 全部新闻数据
var activeSrc = 'all';     // 当前筛选的来源

// 来源 → 标签样式映射
var srcClass = {
  'CCTV新闻':'src-cctv', 'BBC中文':'src-bbc', 'RFI中文':'src-rfi'
};

// 去除 HTML 标签，提取纯文本
function stripHtml(s){
  if(!s) return '';
  var tmp = document.createElement('div');
  tmp.innerHTML = s;
  return (tmp.textContent || tmp.innerText || '').trim();
}

// 将时间戳/日期字符串转为相对时间
function relTime(ds){
  if(!ds) return '';
  var d = new Date(ds);
  if(isNaN(d.getTime())) return ds;
  var diff = (Date.now() - d.getTime()) / 1000;
  if(diff < 0) return '刚刚';
  if(diff < 60) return '刚刚';
  if(diff < 3600) return Math.floor(diff/60) + '分钟前';
  if(diff < 86400) return Math.floor(diff/3600) + '小时前';
  if(diff < 2592000) return Math.floor(diff/86400) + '天前';
  return (d.getMonth()+1) + '月' + d.getDate() + '日';
}

// 渲染来源筛选标签
function renderTabs(){
  var srcs = ['all'];
  var seen = {};
  allNews.forEach(function(n){
    if(!seen[n.source]){ seen[n.source] = 1; srcs.push(n.source); }
  });
  document.getElementById('tabs').innerHTML = srcs.map(function(s){
    var label = s === 'all' ? '📑 全部' : s;
    return '<button class="tab' + (s===activeSrc?' active':'') + '" data-src="' + s + '">' + label + '</button>';
  }).join('');
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){
      activeSrc = t.getAttribute('data-src');
      renderTabs();
      renderNews();
    });
  });
}

// 渲染新闻卡片列表
function renderNews(){
  var list = activeSrc === 'all'
    ? allNews
    : allNews.filter(function(n){ return n.source === activeSrc; });

  document.getElementById('newsCount').textContent = '(' + list.length + '条)';

  if(list.length === 0){
    document.getElementById('newsGrid').innerHTML = '<div class="status">暂无新闻</div>';
    return;
  }

  document.getElementById('newsGrid').innerHTML = list.map(function(n){
    var cls = srcClass[n.source] || 'src-default';
    var imgHtml = n.image
      ? '<img class="card-img" src="' + n.image + '" loading="lazy" onerror="this.style.display=\'none\'" alt="">'
      : '';
    return '<div class="card">' + imgHtml +
      '<div class="card-body">' +
        '<span class="card-src ' + cls + '">' + n.source + '</span>' +
        '<a class="card-title" href="' + n.link + '" target="_blank" rel="noopener">' + n.title + '</a>' +
        '<div class="card-desc">' + stripHtml(n.description).slice(0,130) + '</div>' +
        '<div class="card-time">🕐 ' + relTime(n.pubDate) + '</div>' +
      '</div></div>';
  }).join('');
}

// 从服务端 API 获取新闻
function loadNews(){
  var grid = document.getElementById('newsGrid');
  grid.innerHTML = '<div class="status"><div class="spinner"></div>正在获取最新新闻…</div>';
  fetch('/api/news')
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(data.error) throw new Error(data.error);
      allNews = data.news || [];
      activeSrc = 'all';
      renderTabs();
      renderNews();
    })
    .catch(function(e){
      grid.innerHTML = '<div class="status err">⚠️ 新闻加载失败：' + e.message + '<br>请稍后重试</div>';
    });
}

// 手动刷新按钮
document.getElementById('refreshBtn').addEventListener('click', function(){
  var btn = this;
  btn.textContent = '⏳ 加载中…';
  btn.disabled = true;
  loadNews();
  setTimeout(function(){ btn.textContent = '🔄 刷新'; btn.disabled = false; }, 2000);
});

// 首次加载 + 每 5 分钟自动刷新
loadNews();
setInterval(loadNews, 300000);
</script>
</body>
</html>
